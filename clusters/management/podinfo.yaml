apiVersion: v1

kind: Namespace

metadata:

name: public-web
---
apiVersion: apps/v1

kind: Deployment

metadata:

name: podinfo

namespace: public-web

spec:

selector:

matchLabels:

app: podinfo

template:

metadata:

labels:

app: podinfo

spec:

containers:

- name: podinfo

image: ghcr.io/stefanprodan/podinfo:6.3.3

ports:

- containerPort: 9898
---
apiVersion: v1

kind: Service

metadata:

name: podinfo

namespace: public-web

spec:

ports:

- port: 9898

targetPort: 9898

selector:

app: podinfo